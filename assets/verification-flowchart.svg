<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">人機協作新典範：從「盲讀抓錯」到「結構化核對」</text>
  <text x="400" y="72" text-anchor="middle" font-size="14" fill="#64748b">降低驗證瓶頸（Verification Bottleneck）的建議流程</text>

  <!-- Step 1: User Request -->
  <rect x="50" y="110" width="180" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <rect x="50" y="110" width="180" height="8" rx="4" fill="#3b82f6" />
  <text x="140" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">1. 使用者需求</text>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="#64748b">定義邊界與排除事項</text>
  <text x="140" y="186" text-anchor="middle" font-size="11" fill="#94a3b8">明確不可逆動作</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 230 155 L 290 155" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Step 2: AI Generation -->
  <rect x="300" y="110" width="180" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)" />
  <rect x="300" y="110" width="180" height="8" rx="4" fill="#2563eb" />
  <text x="390" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">2. AI 快速生成</text>
  <text x="390" y="170" text-anchor="middle" font-size="12" fill="#3b82f6">幾秒內產出草稿</text>
  <text x="390" y="186" text-anchor="middle" font-size="11" fill="#60a5fa">邊際成本趨近於零</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 480 155 L 540 155" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Step 3: Verifiable Artifact -->
  <rect x="550" y="105" width="200" height="100" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="2" filter="url(#shadow)" />
  <rect x="550" y="105" width="200" height="8" rx="4" fill="#f59e0b" />
  <text x="650" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">3. 可核對交付物</text>
  <text x="650" y="157" text-anchor="middle" font-size="12" fill="#d97706">✓ 明確標註異動範圍</text>
  <text x="650" y="174" text-anchor="middle" font-size="12" fill="#d97706">✓ 引用來源一鍵回溯</text>
  <text x="650" y="191" text-anchor="middle" font-size="12" fill="#d97706">✓ 主動揭露未知與疑點</text>

  <!-- Arrow Down to Step 4 -->
  <path d="M 650 205 L 650 250 L 510 250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Step 4: Human Verification (The Bottleneck) -->
  <rect x="290" y="225" width="210" height="110" rx="12" fill="#ffffff" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#shadow)" />
  <text x="395" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#e11d48">4. 人類快速核對</text>
  <text x="395" y="275" text-anchor="middle" font-size="12" font-weight="600" fill="#be123c">【核心瓶頸：看懂大於生成】</text>
  <text x="395" y="295" text-anchor="middle" font-size="12" fill="#475569">非盲目重讀全篇</text>
  <text x="395" y="312" text-anchor="middle" font-size="11" fill="#64748b">依四問決策卡定奪放行</text>

  <!-- Rejected Branch -->
  <path d="M 395 335 L 395 375 L 140 375 L 140 210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)" />
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#64748b">未達標 / 存疑：退回重寫或補充依據</text>

  <!-- Approved Path Arrow -->
  <path d="M 290 280 L 220 280" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- Step 5: Safe Production Use -->
  <rect x="30" y="235" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)" />
  <rect x="30" y="235" width="180" height="8" rx="4" fill="#10b981" />
  <text x="120" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">5. 安全正式使用</text>
  <text x="120" y="295" text-anchor="middle" font-size="12" fill="#059669">不必全篇盲讀</text>
  <text x="120" y="312" text-anchor="middle" font-size="11" fill="#34d399">責任明確、風險可控</text>
</svg>
